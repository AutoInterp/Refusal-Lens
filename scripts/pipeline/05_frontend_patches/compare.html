<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Refusal-Lens · Bare vs Jailbreak Compare</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #222;
        }
        .toolbar {
            display: flex;
            gap: 14px;
            align-items: center;
            padding: 10px 18px;
            background: #fafafa;
            border-bottom: 1px solid #ddd;
            font-size: 13px;
            height: 28px;
        }
        .toolbar h1 {
            margin: 0;
            padding-right: 16px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.01em;
            border-right: 1px solid #ccc;
        }
        .toolbar h1 small {
            color: #777;
            font-weight: 400;
            margin-left: 6px;
        }
        .toolbar label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #444;
        }
        .toolbar select {
            padding: 4px 8px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 13px;
            background: white;
            font-family: inherit;
        }
        .toolbar .status {
            margin-left: auto;
            color: #666;
            font-size: 12px;
            font-family: ui-monospace, "SF Mono", Consolas, monospace;
        }
        .panes {
            display: flex;
            height: calc(100vh - 49px);
        }
        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            position: relative;
        }
        .pane-label {
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            border-bottom: 1px solid #ddd;
            height: 16px;
            line-height: 16px;
        }
        .pane.bare .pane-label {
            background: #eceff1;
            color: #263238;
        }
        .pane.jb .pane-label {
            background: #fff3e0;
            color: #bf360c;
        }
        iframe {
            flex: 1;
            border: none;
            border-left: 1px solid #ddd;
            background: #fff;
        }
        .pane.bare iframe {
            border-left: none;
        }
        .error {
            padding: 20px;
            color: #c00;
            font-family: ui-monospace, monospace;
        }
        kbd {
            background: #eee;
            border: 1px solid #bbb;
            border-radius: 3px;
            padding: 1px 5px;
            font-size: 11px;
            font-family: ui-monospace, monospace;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <h1>Refusal-Lens · Compare <small>bare ↔ jailbreak</small></h1>
        <label>
            Prompt:
            <select id="prompt-select"></select>
        </label>
        <label>
            JB class:
            <select id="jb-select">
                <option value="roleplay">roleplay</option>
                <option value="fiction">fiction</option>
                <option value="analytical">analytical</option>
                <option value="completion">completion</option>
                <option value="cognitive_reframe">cognitive_reframe</option>
            </select>
        </label>
        <span class="status" id="status">loading…</span>
    </div>
    <div class="panes">
        <div class="pane bare">
            <div class="pane-label">Bare (no jailbreak)</div>
            <iframe id="pane-left" src="about:blank" title="Bare attribution graph"></iframe>
        </div>
        <div class="pane jb">
            <div class="pane-label" id="jb-label">Jailbreak</div>
            <iframe id="pane-right" src="about:blank" title="Jailbreak attribution graph"></iframe>
        </div>
    </div>

    <script>
    /**
     * compare.html — side-by-side attribution graph viewer.
     *
     * Loads graph-metadata.json, derives available prompt indices and the
     * five JB classes, renders two iframes pointing at the vendored
     * index.html?slug={idx}_bare and index.html?slug={idx}_{jb_class}.
     * No vendored JS patch needed — index.html already honors ?slug= param.
     */
    async function init() {
        const resp = await fetch('./data/graph-metadata.json');
        if (!resp.ok) {
            throw new Error('graph-metadata.json fetch failed: ' + resp.status);
        }
        const meta = await resp.json();

        // Group slugs by prompt index.
        // Our naming convention: {prompt_idx:03d}_{condition}
        //   e.g. 000_bare, 000_fiction, 001_bare, 001_fiction, ...
        const promptInfo = new Map();
        for (const g of meta.graphs) {
            const m = g.slug.match(/^(\d+)_(.+)$/);
            if (!m) continue;
            const idx = m[1];
            const cls = m[2];
            if (!promptInfo.has(idx)) {
                promptInfo.set(idx, { classes: new Set(), prompt_text: g.prompt });
            }
            const info = promptInfo.get(idx);
            info.classes.add(cls);
            if (!info.prompt_text && g.prompt) info.prompt_text = g.prompt;
        }

        // Only keep prompt indices that have both bare and at least one JB class.
        const validIndices = [...promptInfo.keys()]
            .filter(idx => promptInfo.get(idx).classes.has('bare'))
            .sort();

        if (validIndices.length === 0) {
            document.getElementById('status').textContent =
                'no prompt pairs found (need both bare and a JB class)';
            return;
        }

        const promptSelect = document.getElementById('prompt-select');
        for (const idx of validIndices) {
            const info = promptInfo.get(idx);
            const opt = document.createElement('option');
            opt.value = idx;
            const preview = (info.prompt_text || '').slice(0, 55);
            opt.text = preview ? `${idx}: ${preview}${info.prompt_text.length > 55 ? '…' : ''}` : `${idx}`;
            promptSelect.appendChild(opt);
        }

        // Restrict JB-class options to what's actually available for the first prompt
        // (assume all prompts have the same classes; trim if not).
        const availableClasses = promptInfo.get(validIndices[0]).classes;
        const jbSelect = document.getElementById('jb-select');
        for (const opt of [...jbSelect.options]) {
            if (!availableClasses.has(opt.value)) opt.disabled = true;
        }
        // Set default to first non-disabled JB class
        for (const opt of jbSelect.options) {
            if (!opt.disabled) { jbSelect.value = opt.value; break; }
        }

        promptSelect.addEventListener('change', update);
        jbSelect.addEventListener('change', update);

        // Respect URL state if already set (?prompt=... &jb=...)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('prompt')) promptSelect.value = urlParams.get('prompt');
        if (urlParams.has('jb')) jbSelect.value = urlParams.get('jb');

        update();
    }

    function update() {
        const idx = document.getElementById('prompt-select').value;
        const jb = document.getElementById('jb-select').value;
        const bareSlug = `${idx}_bare`;
        const jbSlug = `${idx}_${jb}`;

        const left = document.getElementById('pane-left');
        const right = document.getElementById('pane-right');

        // Only reload if the slug actually changes (avoids flashing on re-select).
        const leftUrl = `./index.html?slug=${encodeURIComponent(bareSlug)}`;
        const rightUrl = `./index.html?slug=${encodeURIComponent(jbSlug)}`;
        if (left.src !== new URL(leftUrl, location.href).href) left.src = leftUrl;
        if (right.src !== new URL(rightUrl, location.href).href) right.src = rightUrl;

        document.getElementById('jb-label').textContent = `Jailbreak: ${jb}`;
        document.getElementById('status').textContent = `${bareSlug} ↔ ${jbSlug}`;

        // Sync URL for sharability
        const params = new URLSearchParams();
        params.set('prompt', idx);
        params.set('jb', jb);
        history.replaceState(null, '', '?' + params.toString());
    }

    init().catch(e => {
        document.getElementById('status').textContent = 'error: ' + e.message;
        document.body.insertAdjacentHTML('beforeend',
            `<div class="error">Failed to initialize compare viewer:<br><pre>${e.stack || e.message}</pre></div>`);
        console.error(e);
    });
    </script>
</body>
</html>
