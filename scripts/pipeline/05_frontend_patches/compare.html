<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Refusal-Lens · Bare vs Jailbreak Compare</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #222;
        }
        .toolbar {
            display: flex;
            gap: 14px;
            align-items: center;
            padding: 10px 18px;
            background: #fafafa;
            border-bottom: 1px solid #ddd;
            font-size: 13px;
            height: 28px;
        }
        .toolbar h1 {
            margin: 0;
            padding-right: 16px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.01em;
            border-right: 1px solid #ccc;
        }
        .toolbar h1 small {
            color: #777;
            font-weight: 400;
            margin-left: 6px;
        }
        .toolbar label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #444;
        }
        .toolbar select {
            padding: 4px 8px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 13px;
            background: white;
            font-family: inherit;
        }
        .toolbar .status {
            margin-left: auto;
            color: #666;
            font-size: 12px;
            font-family: ui-monospace, "SF Mono", Consolas, monospace;
        }
        .panes {
            display: flex;
            height: calc(100vh - 49px);
        }
        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            position: relative;
        }
        .pane-label {
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            border-bottom: 1px solid #ddd;
            height: 16px;
            line-height: 16px;
        }
        .pane.bare .pane-label {
            background: #eceff1;
            color: #263238;
        }
        .pane.jb .pane-label {
            background: #fff3e0;
            color: #bf360c;
        }
        iframe {
            flex: 1;
            border: none;
            border-left: 1px solid #ddd;
            background: #fff;
        }
        .pane.bare iframe {
            border-left: none;
        }
        .error {
            padding: 20px;
            color: #c00;
            font-family: ui-monospace, monospace;
        }
        kbd {
            background: #eee;
            border: 1px solid #bbb;
            border-radius: 3px;
            padding: 1px 5px;
            font-size: 11px;
            font-family: ui-monospace, monospace;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <h1>Refusal-Lens · Compare <small>bare ↔ jailbreak</small></h1>
        <label>
            Prompt:
            <select id="prompt-select"></select>
        </label>
        <label>
            JB class:
            <select id="jb-select"></select>
        </label>
        <span class="status" id="status">loading…</span>
    </div>
    <div class="panes">
        <div class="pane bare">
            <div class="pane-label">Bare (no jailbreak)</div>
            <iframe id="pane-left" src="about:blank" title="Bare attribution graph"></iframe>
        </div>
        <div class="pane jb">
            <div class="pane-label" id="jb-label">Jailbreak</div>
            <iframe id="pane-right" src="about:blank" title="Jailbreak attribution graph"></iframe>
        </div>
    </div>

    <script>
    /**
     * compare.html — side-by-side attribution graph viewer.
     *
     * Loads graph-metadata.json, groups graphs by prompt index, and renders two
     * iframes: bare on the left, a chosen condition on the right, via the
     * vendored index.html?slug=<full-slug> (index.html honors ?slug=).
     *
     * Slug convention: {idx:03d}_{condition}[_{mode}] where condition is
     * bare | jb_<class> | ctrl_<class> and mode (optional) is single|multi —
     * e.g. 000_bare_single, 000_jb_fiction_single. Older runs used {idx}_{class}
     * with no prefix/mode; both are handled. We always navigate using the ACTUAL
     * slug string from metadata, never a reconstructed one.
     */
    const MODE_SUFFIXES = new Set(['single', 'multi']);

    // Returns {idx, cond} with any trailing mode suffix stripped, or null.
    function parseCondition(slug) {
        const m = slug.match(/^(\d+)_(.+)$/);
        if (!m) return null;
        let cond = m[2];
        const parts = cond.split('_');
        if (parts.length > 1 && MODE_SUFFIXES.has(parts[parts.length - 1])) {
            cond = parts.slice(0, -1).join('_');
        }
        return { idx: m[1], cond };
    }

    let promptInfo;   // idx -> { condToSlug: Map<cond, fullSlug>, prompt_text }

    async function init() {
        const resp = await fetch('./data/graph-metadata.json');
        if (!resp.ok) {
            throw new Error('graph-metadata.json fetch failed: ' + resp.status);
        }
        const meta = await resp.json();

        promptInfo = new Map();
        const conditions = new Set();   // all non-bare conditions present
        for (const g of meta.graphs) {
            const parsed = parseCondition(g.slug);
            if (!parsed) continue;
            const { idx, cond } = parsed;
            if (!promptInfo.has(idx)) {
                promptInfo.set(idx, { condToSlug: new Map(), prompt_text: g.prompt });
            }
            const info = promptInfo.get(idx);
            info.condToSlug.set(cond, g.slug);   // store the ACTUAL filename slug
            if (!info.prompt_text && g.prompt) info.prompt_text = g.prompt;
            if (cond !== 'bare') conditions.add(cond);
        }

        // Valid prompts have a bare graph and at least one non-bare graph to pair.
        const validIndices = [...promptInfo.keys()]
            .filter(idx => {
                const conds = promptInfo.get(idx).condToSlug;
                return conds.has('bare') && [...conds.keys()].some(c => c !== 'bare');
            })
            .sort();

        if (validIndices.length === 0) {
            document.getElementById('status').textContent =
                'no prompt pairs found (need a bare graph + at least one other condition)';
            return;
        }

        const promptSelect = document.getElementById('prompt-select');
        for (const idx of validIndices) {
            const info = promptInfo.get(idx);
            const opt = document.createElement('option');
            opt.value = idx;
            const preview = (info.prompt_text || '').slice(0, 55);
            opt.text = preview ? `${idx}: ${preview}${info.prompt_text.length > 55 ? '…' : ''}` : `${idx}`;
            promptSelect.appendChild(opt);
        }

        // Populate the condition dropdown from what's actually present.
        // Order: jb_* first, then ctrl_*, then anything else; alpha within group.
        const rank = c => c.startsWith('jb_') ? 0 : c.startsWith('ctrl_') ? 1 : 2;
        const jbSelect = document.getElementById('jb-select');
        const sortedConds = [...conditions].sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));
        for (const cond of sortedConds) {
            const opt = document.createElement('option');
            opt.value = cond;
            opt.text = cond;
            jbSelect.appendChild(opt);
        }

        promptSelect.addEventListener('change', update);
        jbSelect.addEventListener('change', update);

        // Respect URL state if already set (?prompt=... &jb=...)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('prompt')) promptSelect.value = urlParams.get('prompt');
        if (urlParams.has('jb')) jbSelect.value = urlParams.get('jb');

        update();
    }

    function update() {
        const idx = document.getElementById('prompt-select').value;
        const jbCond = document.getElementById('jb-select').value;
        const info = promptInfo.get(idx);
        if (!info) return;

        const bareSlug = info.condToSlug.get('bare');
        const jbSlug = info.condToSlug.get(jbCond);
        if (!bareSlug || !jbSlug) {
            document.getElementById('status').textContent =
                `missing graph for ${idx} (${!bareSlug ? 'bare' : jbCond})`;
            return;
        }

        const left = document.getElementById('pane-left');
        const right = document.getElementById('pane-right');

        // Navigate using the actual slug strings from metadata.
        const leftUrl = `./index.html?slug=${encodeURIComponent(bareSlug)}`;
        const rightUrl = `./index.html?slug=${encodeURIComponent(jbSlug)}`;
        if (left.src !== new URL(leftUrl, location.href).href) left.src = leftUrl;
        if (right.src !== new URL(rightUrl, location.href).href) right.src = rightUrl;

        document.getElementById('jb-label').textContent = `Condition: ${jbCond}`;
        document.getElementById('status').textContent = `${bareSlug} ↔ ${jbSlug}`;

        // Sync URL for sharability
        const params = new URLSearchParams();
        params.set('prompt', idx);
        params.set('jb', jbCond);
        history.replaceState(null, '', '?' + params.toString());
    }

    init().catch(e => {
        document.getElementById('status').textContent = 'error: ' + e.message;
        document.body.insertAdjacentHTML('beforeend',
            `<div class="error">Failed to initialize compare viewer:<br><pre>${e.stack || e.message}</pre></div>`);
        console.error(e);
    });
    </script>
</body>
</html>
